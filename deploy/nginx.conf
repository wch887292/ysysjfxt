# Nginx 反向代理配置 - 健康饮食积分系统
# 部署位置：/etc/nginx/conf.d/diet-points.conf
# 前提：域名已解析到此服务器，SSL证书已配置

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名
    return 301 https://$server_name$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 替换为你的域名

    # SSL 证书配置（使用腾讯云免费证书或 Let's Encrypt）
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体大小限制（图片上传最大 10MB）
    client_max_body_size 10m;

    # API 反向代理 → Node.js (PM2 cluster)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 30s;    # AI 接口需较长超时
        proxy_send_timeout 30s;
    }

    # 静态资源（礼品图片等）→ Node.js 静态文件服务
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 静态资源缓存 7 天
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy cross-origin;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cross-Origin-Resource-Policy cross-origin;
    }

    # 健康检查（无需认证）
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 日志
    access_log  /var/log/nginx/diet-points-access.log;
    error_log   /var/log/nginx/diet-points-error.log;
}
