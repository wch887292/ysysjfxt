# ========================================
# 健康饮食积分系统 - Nginx 配置
# 域名: rry.klai.top
# 服务: MySQL + Node.js Backend
# ========================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================
    # HTTP → HTTPS 强制跳转
    # ============================
    server {
        listen 80;
        server_name rry.klai.top www.rry.klai.top;

        # 用于 ACME 证书验证（Let's Encrypt）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$server_name$request_uri;
    }

    # ============================
    # HTTPS 主站点
    # ============================
    server {
        listen 443 ssl http2;
        server_name rry.klai.top www.rry.klai.top;

        # SSL 证书路径
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL 优化配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # 请求体大小限制（图片上传最大 10MB）
        client_max_body_size 10m;

        # ==================== API 请求代理 ====================
        location /api/ {
            proxy_pass http://backend:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置（AI 接口需要较长时间）
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # 缓冲优化
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ==================== 健康检查端点 ====================
        location /api/health {
            proxy_pass http://backend:3001/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ==================== 静态资源（代理到后端，后端从 /app/public 提供）====================
        # proxy_pass 末尾不加 /，保留原始URI的 /static 前缀给后端express.static处理
        # 例如: /static/images/gifts/default.png → http://backend:3001/static/images/gifts/default.png
        location /static/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Resource-Policy "cross-origin";
            access_log off;
        }

        # ==================== 用户上传文件（代理到后端，后端从 /app/uploads 提供）====================
        # proxy_pass 末尾不加 /，保留 /uploads 前缀给后端express.static处理
        location /uploads/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
            add_header Cross-Origin-Resource-Policy "cross-origin";
            expires 7d;
            add_header Cache-Control "public";
        }

        # ==================== 管理后台前端（Vue SPA）====================
        location /admin/ {
            alias /www/wwwroot/admin-dist/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
        }

        # 管理后台静态资源（独立 location，避免嵌套 alias 问题）
        location /admin/assets/ {
            alias /www/wwwroot/admin-dist/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /admin/favicon.svg {
            alias /www/wwwroot/admin-dist/favicon.svg;
            add_header Cache-Control "public";
            access_log off;
        }

        # ==================== 根路径重定向到管理后台 ====================
        location = / {
            rewrite ^(/)$ /admin/ permanent;
        }

        # ==================== 错误页面 ====================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
